[variables]
NODE_VERSION = "20"
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@10", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/db build", "pnpm --filter @workspace/api-client-react build", "pnpm --filter @workspace/corneriq build"]

[start]
cmd = "npx serve dist -p $PORT"
