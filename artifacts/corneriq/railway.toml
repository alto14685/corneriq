[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm --filter @workspace/db build && pnpm --filter @workspace/api-client-react build && pnpm --filter @workspace/corneriq build"

[variables]
NIXPACKS_NODE_VERSION = "20"

[deploy]
startCommand = "npx serve dist -p $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Required environment variables (set in Railway dashboard):
#   VITE_API_URL   — public URL of the deployed api-server service
#                    e.g. https://corneriq-api-production.up.railway.app
#
# Note: VITE_API_URL must be set at BUILD time (not just runtime) because
# Vite inlines it into the bundle during the build step.
# In Railway: set the variable on this service, then trigger a redeploy.
